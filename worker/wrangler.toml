name = "kleinemaus-api"
main = "worker.js"
compatibility_date = "2026-10-01"
account_id = "4f04114f0678cd3d85e2dec4279be226"
routes = [{ pattern = "kleinemaus-api.wenz.io", custom_domain = true }]

[[kv_namespaces]]
binding = "KV"
id = "abdca3d510024afc92aa63b1ac0e4108"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "STATE"
class_name = "MouseState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MouseState"]

# Edge-Rate-Limit pro IP, noch vor dem Durable Object (kostet nichts extra)
[[ratelimits]]
name = "LIMITER"
namespace_id = "73514"
simple = { limit = 60, period = 60 }
